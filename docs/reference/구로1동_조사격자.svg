<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 980" role="img" aria-labelledby="title desc">
<title id="title">구로1동 100미터 조사 격자</title><desc id="desc">2026년 파생 행정동 경계를 임시로 사용한 좌표 색인. 파란 18칸은 신영상가 주변 9칸과 서쪽 인접 9칸의 평면지도 1차 확인 구간이며 다른 119칸은 미조사다. 출입구와 도로 높이, 정확한 시설 귀속은 미확인이다.</desc>
